name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  docker-build-push:
    uses: k-wa-wa/nuage-workspace/.github/workflows/docker-build-push.yml@master
    with:
      image: ghcr.io/${{ github.repository }}
      pr-comment-marker: "🚀 Preview Environment"
      pr-comment-body: |
        ### 🚀 Preview Environment
        PR プレビュー環境のイメージビルドが完了した:
        🔗 [Preview Environment](https://bwproxy-pr-${{ github.event.pull_request.number }}.wpcapp.net)
